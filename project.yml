name: RetroCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  RetroCam:
    type: application
    platform: iOS
    sources: [RetroCam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.retrocam
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RetroCam
        INFOPLIST_KEY_NSCameraUsageDescription: RetroCam needs the camera to take photos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: RetroCam saves your photos to the library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
